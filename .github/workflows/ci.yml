name: CI
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Java for isolated security tests
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            npm ci --fetch-retries=5 --fetch-retry-mintimeout=10000 --fetch-retry-maxtimeout=60000 && exit 0
            echo "npm ci falló (intento $i); reintentando en 15s…" >&2
            sleep 15
          done
          echo "npm ci falló tras 3 intentos" >&2
          exit 1
      - name: Audit all dependencies, including build tools
        run: npm run audit:security
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Firebase security rules tests
        run: npm run test:security
      - name: Build
        run: npm run build
